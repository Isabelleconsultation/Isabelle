    <h1>Contact</h1>
  </header>
<br><br>
<main style="padding: 2em; max-width: 600px; margin: auto; background-color: #d0ecff; border-radius: 12px;">
  <p>If you'd like to connect with me, ask a question, or schedule a session, feel free to reach out through the form below:</p>
  <form action="#" method="post" style="display: flex; flex-direction: column; gap: 1em; margin-top: 1em;">
    <input type="text" name="name" placeholder="Your Name" required
      style="padding: 0.8em; border: 1px solid #ccc; border-radius: 10px; font-size: 1em;">
    <input type="email" name="email" placeholder="Your Email" required
      style="padding: 0.8em; border: 1px solid #ccc; border-radius: 10px; font-size: 1em;">
    <textarea name="message" rows="6" placeholder="Your Message" required
      style="padding: 0.8em; border: 1px solid #ccc; border-radius: 10px; font-size: 1em;"></textarea>
    <button type="submit"
      style="padding: 0.7em; background-color: #4a90e2; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1em; cursor: pointer; transition: background 0.3s ease;">
      Send Message
    </button>
  </form>
</main>
